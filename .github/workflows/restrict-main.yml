name: Restrict Main Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "preview" ]; then
            echo "Error: Pull requests to main must originate from the preview branch."
            exit 1
          fi
          echo "Source branch is preview. Proceeding."
